spring.application.name=phelti

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/phelti_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Origenes del front permitidos (separados por coma)
phelti.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8081,http://127.0.0.1:8081

# Entorno local de demostración. No sustituye autenticación ni autorización.
server.address=${PHELTI_BIND_ADDRESS:127.0.0.1}

phelti.demo.key=${PHELTI_DEMO_KEY:}
